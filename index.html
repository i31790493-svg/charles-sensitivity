<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Charles Sensitivity Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎯 Charles Sensitivity Hub</h1>
        <p>Best Free Fire Sensitivity For Your Phone</p>
    </header>

    <main>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search phone model..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="result">
            <h2>Search your phone sensitivity</h2>
            <p>Example: Infinix Hot 40i, Tecno Spark 20, Redmi Note 13...</p>
        </div>
    </main>

    <footer>
        <p>© 2026 Charles Sensitivity Hub</p>
    </footer>

    <script type="module" src="script.js"></script>

</body>
</html>
