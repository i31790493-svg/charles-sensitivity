<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles Sensitivity Hub - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🛠 Admin Panel</h1>

<button id="logoutBtn">🚪 Logout</button>

<br><br>

<input type="text" id="phone" placeholder="Phone Model">

<input type="number" id="general" placeholder="General">

<input type="number" id="redDot" placeholder="Red Dot">

<input type="number" id="scope2x" placeholder="2× Scope">

<input type="number" id="scope4x" placeholder="4× Scope">

<input type="number" id="sniper" placeholder="Sniper">

<input type="number" id="freeLook" placeholder="Free Look">

<button id="saveBtn">💾 Save Phone</button>

<hr>

<h2>Saved Phones</h2>

<div id="phoneList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
