<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles Sensitivity Hub - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎯 Charles Sensitivity Hub</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <input type="text" id="phone" placeholder="Phone Model">

  <input type="number" id="general" placeholder="General">

  <input type="number" id="redDot" placeholder="Red Dot">

  <input type="number" id="scope2x" placeholder="2× Scope">

  <input type="number" id="scope4x" placeholder="4× Scope">

  <input type="number" id="sniper" placeholder="Sniper Scope">

  <input type="number" id="freeLook" placeholder="Free Look">

  <button id="saveBtn">💾 Save Phone</button>

  <br><br>

  <h2>Saved Phones</h2>

  <div id="phoneList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
